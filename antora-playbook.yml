# Valentus demo site (GitHub Pages)
# Layered build (Default UI base + supplemental) — same merge as release CI.
# Consumers: pin valentus-theme ui-bundle.zip (see README / installation.adoc).
site:
  title: Valentus Theme
  url: https://antora-supplemental.github.io/valentus-theme
  start_page: valentus-theme:guide:index.adoc
  robots: |
    User-agent: *
    Allow: /
    Sitemap: https://antora-supplemental.github.io/valentus-theme/sitemap.xml
  keys:
    dark_mode_navbar: light
    # Valentus brand (demo only): blood drop from docs/brand via brand-overlay.js.
    # Consumers get the neutral placeholder; see guide Header logo.
    header_logo: valentus-drop.svg
    favicon: valentus-favicon.svg

content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs
    # Baseline body fixtures (canonical copy in demo-data — not in-repo ROOT)
    - url: https://github.com/antora-supplemental/demo-data.git
      tags: [v0.3.5]
      branches: []
      start_path: docs/demo-pages

ui:
  bundle:
    url: https://gitlab.com/antora/antora-ui-default/-/jobs/artifacts/HEAD/raw/build/ui-bundle.zip?job=bundle-stable
    snapshot: true
  supplemental_files: ./packages/valentus-layout/supplemental-ui

output:
  dir: ./build/site

runtime:
  fetch: true

antora:
  extensions:
    # Shared placeholder logo + favicons from the chassis (Valentus ships none)
    - require: "@antora-supplemental/brand-placeholder"
    # Valentus brand overlay (demo/docs only; not in the shipped bundle)
    - require: ./docs/brand/lib/brand-overlay.js
    - require: "@antora-supplemental/light-dark-mode"
      toggle: placed
    # Valentus Paint (repo root ./paint): links css/valentus-paint.css at the layout paint slot
    - require: ./paint/lib/index.js
    - require: "@antora/lunr-extension"
      index_latest_only: true
      index_by_heading: true
      snippet_length: 200
    # Wrap lunr with Search/Ask UI (phase 1 stub — no API keys; see @antora-supplemental/antora-search-chat)
    - require: "@antora-supplemental/antora-search-chat"
    # Last: ?v=<content hash> on CSS/JS URLs so deploys show up at once (chassis asset-fingerprint).
    - require: "@antora-supplemental/asset-fingerprint"

asciidoc:
  extensions:
    - "@asciidoctor/tabs"
  attributes:
    source-highlighter: highlight.js
    icons: font
