# Visual redesign demo — guide from this worktree; fixtures from demo-data.
# UI overlays come from this worktree's ./supplemental-ui
site:
  title: Valentus Theme
  url: https://antora-supplemental.github.io/valentus-theme
  start_page: valentus-theme:guide:index.adoc
  keys:
    dark_mode_navbar: light
    header_logo: logo.svg

content:
  sources:
    - url: .
      branches: HEAD
      start_path: docs
    - url: https://github.com/antora-supplemental/demo-data.git
      tags: [v0.3.5]
      branches: []
      start_path: docs/demo-pages

ui:
  bundle:
    url: https://github.com/antora-supplemental/antora-dark-mode/releases/download/v1.4.6/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site

runtime:
  fetch: true

antora:
  extensions:
    - require: "@antora/lunr-extension"
      index_latest_only: true
      index_by_heading: true
      snippet_length: 200
    - require: "@antora-supplemental/antora-search-chat"

asciidoc:
  extensions:
    - "@asciidoctor/tabs"
  attributes:
    source-highlighter: highlight.js
    icons: font
