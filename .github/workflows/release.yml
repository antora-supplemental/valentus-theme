name: Release

on:
  push:
    tags:
      # Pure semver only — dual-axis discoverability tags (vX.Y.Z+antora.N) must not re-trigger.
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: Semver X.Y.Z to publish (tag vX.Y.Z must exist on the remote)
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}

jobs:
  release:
    if: >
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && !contains(github.ref_name, '+'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify package version matches tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          TAG_VERSION="${RELEASE_VERSION#v}"
          TAG_VERSION="${TAG_VERSION%%+*}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "Error: package.json version ($PACKAGE_VERSION) does not match tag version ($TAG_VERSION)"
            exit 1
          fi

      - name: Resolve dual-axis release label
        id: label
        run: |
          VERSION="${RELEASE_VERSION#v}"
          VERSION="${VERSION%%+*}"
          ANTORA_MAJOR="${ANTORA_MAJOR:-3}"
          LABEL="${VERSION}+antora.${ANTORA_MAJOR}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "label=${LABEL}" >> "$GITHUB_OUTPUT"
          echo "antora=${ANTORA_MAJOR}" >> "$GITHUB_OUTPUT"
        env:
          ANTORA_MAJOR: "3"

      - name: Generate changelog for release
        id: changelog
        run: |
          VERSION="${{ steps.label.outputs.version }}"
          LABEL="${{ steps.label.outputs.label }}"
          if [ -f "CHANGELOG.adoc" ]; then
            NOTES=$(awk -v v="$VERSION" '
              $0 ~ "^== \\[" v "\\]" {flag=1; next}
              flag && /^== \[/ {exit}
              flag {print}' CHANGELOG.adoc)
            if [ -z "$NOTES" ]; then
              NOTES="Release **${LABEL}** (git tag \`v${VERSION}\`)."
            else
              NOTES=$(printf 'Public label: **%s** (git tag `v%s`).\n\n%s' "$LABEL" "$VERSION" "$NOTES")
            fi
          else
            NOTES="Release **${LABEL}** (git tag \`v${VERSION}\`)."
          fi
          echo "$NOTES" > release_notes.md

      - name: Resolve antora-dark-mode pin
        id: darkmode
        run: |
          DM_VERSION=$(grep -oE 'antora-dark-mode/releases/download/v[0-9]+\.[0-9]+\.[0-9]+' antora-playbook.yml | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          if [ -z "$DM_VERSION" ]; then
            echo "Could not read antora-dark-mode version from antora-playbook.yml"
            exit 1
          fi
          echo "version=v${DM_VERSION}" >> "$GITHUB_OUTPUT"
          echo "Using antora-dark-mode ${DM_VERSION}"

      - name: Fetch antora-dark-mode for vendor sync
        run: |
          git clone --depth 1 --branch ${{ steps.darkmode.outputs.version }} https://github.com/antora-supplemental/antora-dark-mode.git ../antora-dark-mode

      - name: Build Antora UI Bundle
        run: |
          DARK_MODE_BUNDLE_URL="https://github.com/antora-supplemental/antora-dark-mode/releases/download/${{ steps.darkmode.outputs.version }}/ui-bundle.zip"
          curl -L -o dark-mode-ui-bundle.zip "$DARK_MODE_BUNDLE_URL"
          mkdir -p build/ui-bundle
          unzip dark-mode-ui-bundle.zip -d build/ui-bundle
          node scripts/sync-dark-mode.mjs
          cp -r supplemental-ui/* build/ui-bundle/
          cd build/ui-bundle
          zip -r ../../ui-bundle.zip .
          cd ../..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ steps.label.outputs.label }}
          body_path: release_notes.md
          files: ui-bundle.zip
          overwrite_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release commit
        id: rel
        run: echo "sha=$(git rev-list -n 1 "${RELEASE_TAG}")" >> "$GITHUB_OUTPUT"

      - name: Update rolling release lines
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.label.outputs.version }}
          ANTORA_MAJOR: ${{ steps.label.outputs.antora }}
          RELEASE_SHA: ${{ steps.rel.outputs.sha }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/post-release.mjs "${VERSION}" ui-bundle.zip

      - name: Optional dual-axis discoverability tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          LABEL_TAG="v${{ steps.label.outputs.label }}"
          if git rev-parse "$LABEL_TAG" >/dev/null 2>&1; then
            echo "Tag $LABEL_TAG already exists"
          else
            git tag -a "$LABEL_TAG" -m "${{ steps.label.outputs.label }}" "${{ steps.rel.outputs.sha }}"
            git push origin "$LABEL_TAG"
          fi

      - name: Commit supported-lines.json on main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp supported-lines.json /tmp/supported-lines.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git pull origin main
          cp /tmp/supported-lines.json supported-lines.json
          git add supported-lines.json
          if git diff --staged --quiet; then
            echo "supported-lines.json unchanged"
          else
            git commit -m "chore: update supported-lines.json for ${RELEASE_TAG}"
            git push origin main
          fi
