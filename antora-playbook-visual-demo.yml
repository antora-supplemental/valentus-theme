# Visual redesign demo — content from main clone (Antora rejects linked worktrees as url: .)
# UI overlays come from this worktree's ./supplemental-ui
site:
  title: Valentus Theme
  url: https://antora-supplemental.github.io/valentus-theme
  start_page: valentus-theme:guide:index.adoc
  keys:
    dark_mode_navbar: light
    header_logo: logo.svg
    header_logo_dark: logo-dark.svg

content:
  sources:
    # Sibling primary checkout (real .git directory). Docs need not match this branch.
    - url: ./../valentus-theme
      branches: main
      start_path: docs

ui:
  bundle:
    url: https://github.com/antora-supplemental/antora-dark-mode/releases/download/v1.3.1/ui-bundle.zip
    snapshot: true
  supplemental_files: ./supplemental-ui

output:
  dir: ./build/site

runtime:
  fetch: false

antora:
  extensions:
    - require: "@antora/lunr-extension"
      index_latest_only: true
      index_by_heading: true
      snippet_length: 200

asciidoc:
  extensions:
    - "@asciidoctor/tabs"
  attributes:
    source-highlighter: highlight.js
    icons: font
